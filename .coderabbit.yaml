# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit AI Configuration

reviews:
    auto_review:
        enabled: true
        drafts: false
        # Later pushes are requested deliberately so the one-hour service gate
        # is observed instead of triggering an uncontrolled review per commit.
        auto_incremental_review: false
        auto_pause_after_reviewed_commits: 0
        base_branches:
            - "main-VR"
    # Unmatched files, including hidden policy files, remain reviewable by
    # default. Positive entries only restore review for authoritative shader
    # source roots and checked-in CSV evidence that CodeRabbit skips by
    # default. Generated outputs must not be stored in those source roots.
    # https://docs.coderabbit.ai/configuration/path-instructions
    path_filters:
        - "package/Shaders/**/*.hlsl"
        - "package/Shaders/**/*.hlsli"
        - "features/*/Shaders/**/*.hlsl"
        - "features/*/Shaders/**/*.hlsli"
        - "docs/new-feature-template/**/Shaders/**/*.hlsl"
        - "docs/new-feature-template/**/Shaders/**/*.hlsli"
        - "docs/development/vr-render-scale-comparison-ledger.csv"
        - "docs/development/vr-renderscale-CSmenu-comparison-ledger.csv"
        # Repository-specific game assets not covered by the service defaults.
        - "!**/*.esp"
        - "!**/*.nif"
        - "!**/*.PNG"
        - "!**/*.wpc"
    path_instructions:
        - path: "**/*"
          instructions: |
              When reviewing PRs, please provide suggestions for:

              1. **Conventional Commit Titles** (if not following https://www.conventionalcommits.org/ or
              if the existing title does not describe the code changes):
                 Format: type(scope): description
                 Length: 50 characters limit for title, 72 for body
                 Style: lowercase description, no ending period
                 Examples:
                 - feat(vr): add cross-eye sampling
                 - fix(water): resolve flowmap bug
                 - docs: update shader documentation

              2. **Issue References** (if PR fixes bugs or implements features):
                 Suggest adding appropriate GitHub keywords:
                 - "Fixes #123" or "Closes #123" for bug fixes
                 - "Implements #123" or "Addresses #123" for features
                 - "Related to #123" for partial implementations

              Otherwise, use your standard review approach focusing on code quality.
