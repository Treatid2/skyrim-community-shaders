# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit AI Configuration

reviews:
    auto_review:
        enabled: true
        drafts: false
        # Later pushes are requested deliberately so the one-hour service gate
        # is observed instead of triggering an uncontrolled review per commit.
        auto_incremental_review: false
        auto_pause_after_reviewed_commits: 0
        base_branches:
            - "main-VR"
    # A live review confirmed that unmatched files are omitted once positive
    # filters exist. Keep the source allow-list explicit and pair it with
    # independent output exclusions so generated source-shaped files stay out.
    # https://docs.coderabbit.ai/configuration/path-instructions
    path_filters:
        - "**/*.bat"
        - "**/*.c"
        - "**/*.cc"
