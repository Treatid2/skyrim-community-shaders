name: "Controller baseline for PR 115"

on:
    workflow_dispatch:
        inputs:
            allocation-sha:
                description: "Exact main-VR baseline source"
                required: true
                type: string

permissions:
    contents: read

jobs:
    baseline:
        if: inputs.allocation-sha == '957ff4f17e34a4efc4f56553b79355eb32014dbb'
        name: "Exact main-VR 957ff4f1"
        uses: ParticleTroned/skyrim-community-shaders/.github/workflows/_shared-build.yaml@957ff4f17e34a4efc4f56553b79355eb32014dbb
        with:
            repository: ParticleTroned/skyrim-community-shaders
            ref: 957ff4f17e34a4efc4f56553b79355eb32014dbb
            run-cpp: true
            run-shader-validation: false
            run-shader-tests: false
            hlsl-should-build: "false"
            shader-tests-should-build: "false"
